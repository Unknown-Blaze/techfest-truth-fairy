<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">Truth Fairy architecture</title>
<desc id="desc">A Manifest V3 Chrome extension (content script, background service worker, popup) calls two local services. The Flask model server on port 5000 exposes /fact-check (GPT-4o-mini writes a search query, Brave Search returns sources, the publish date is looked up, GPT-4o-mini gives the verdict) and /predict (dlib face crop for video frames, Xception deepfake classifier in PyTorch, Grad-CAM heatmap). The Express backend on port 3000 stores flags, annotations and discussion threads in Firestore.</desc>
